# Values for the oan-a2c chart (charts/oan-a2c).
# Target: the A2C app cluster (not provisioned yet). The same file runs a local
# single-node cluster (docs/a2c.md, "Local").
# Release `a2c`, namespace `a2c-develop`.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `develop-<build>` (locally: `develop`)
# - frappe.mariadb-sts.rootPassword: from Secret oan-a2c-db, with --set-string

siteName: develop.a2c.test

siteConfig:
  host_name: https://a2c-backend-dev.oanstaging.com
  openg2p_base_url: https://registry.oanstaging.com/
  openg2p_db: socialregistry_staging

# The central APISIX gateway runs in another cluster and reaches Frappe on this node port
# (web.port in oan-a2c-gateway.yaml). Allow it in the node's security group from the
# gateway cluster's addresses only.
gatewayAccess:
  enabled: true
  web:
    nodePort: 30810

frappe:
  image:
    # Jenkinsfile ECR_REPO `oan/a2c`. A local build tagged with this name is used without
    # a pull (pullPolicy IfNotPresent).
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/a2c
    pullPolicy: IfNotPresent
  # ECR pull Secret, see docs/ecr-pull-access.md.
  imagePullSecrets: []

  mariadb-sts:
    enabled: true
    image:
      tag: "11.8"
    persistence:
      storageClass: local-path-shared
      size: 8Gi

  persistence:
    worker:
      storageClass: local-path-shared
      size: 8Gi

  jobs:
    createSite:
      siteName: develop.a2c.test
