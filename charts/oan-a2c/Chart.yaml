annotations:
  oan.org/owner: OpenAgriNet (OAN) / COSS
  oan.org/application-source: https://github.com/Centre-for-Open-Societal-Systems/oan_a2c
  oan.org/chart-source: https://github.com/Centre-for-Open-Societal-Systems/oan-helm/tree/main/charts/oan-a2c
