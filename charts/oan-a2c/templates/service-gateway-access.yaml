{{- if .Values.gatewayAccess.enabled }}
{{- $access := .Values.gatewayAccess }}
{{- range $component, $target := dict "web" "gunicorn" }}
{{- $svc := index $access $component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-gateway-{{ $component }}
  labels:
    {{- include "a2c.labels" $ | nindent 4 }}
  {{- with $access.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $access.type }}
  {{- with $access.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
      {{- if and $svc.nodePort (ne $access.type "ClusterIP") }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
  # The upstream chart's Pod labels for this component.
  selector:
    app.kubernetes.io/name: {{ default "frappe" $.Values.frappe.nameOverride }}-{{ $target }}
    app.kubernetes.io/instance: {{ $.Release.Name }}-{{ $target }}
{{- end }}
{{- end }}
